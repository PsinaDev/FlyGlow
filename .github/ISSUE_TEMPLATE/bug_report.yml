name: Bug report
description: Something in FlyGlow is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the error message if there was one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the "Fire" layer
        2. Press "Send to dock"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FlyGlow version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Installer
        - Portable
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: firmware
    attributes:
      label: Dock firmware
      description: Shown in Space Station's device page.
      placeholder: "0.0.3.9"
  - type: dropdown
    id: space-station
    attributes:
      label: Was Flydigi Space Station running?
      options:
        - "Yes"
        - "No"
        - Not installed
  - type: textarea
    id: attachments
    attributes:
      label: Scene, screenshots or video
      description: Zip the .flyglow file if the problem depends on the scene.
